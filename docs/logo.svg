<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">under the hood</title>
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="2.6" fill="#d6cdbd"/>
    </pattern>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <!-- paper tile -->
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#f5f0e6"/>
    <rect width="512" height="512" fill="url(#dots)" opacity=".75"/>
  </g>

  <g stroke="#1f1d1a" stroke-linecap="round" stroke-linejoin="round">
    <!-- prop rod holding the hood up -->
    <line x1="378" y1="276" x2="352" y2="152" stroke-width="10"/>

    <!-- the hood, popped open on a hinge at the left -->
    <g transform="rotate(-22 104 262)">
      <rect x="92" y="226" width="336" height="40" rx="20" fill="#fffdf8" stroke-width="14"/>
      <line x1="140" y1="246" x2="300" y2="246" stroke="#d6cdbd" stroke-width="8"/>
    </g>

    <!-- the machine body -->
    <rect x="92" y="272" width="328" height="160" rx="26" fill="#fffdf8" stroke-width="14"/>

    <!-- lanes inside -->
    <line x1="132" y1="326" x2="380" y2="326" stroke="#d6cdbd" stroke-width="7" stroke-dasharray="4 16"/>
    <line x1="132" y1="384" x2="380" y2="384" stroke="#d6cdbd" stroke-width="7" stroke-dasharray="4 16"/>

    <!-- request packet, heading in -->
    <rect x="150" y="304" width="118" height="44" rx="22" fill="#2f6fde" stroke-width="10"/>
    <polyline points="200,316 214,326 200,336" fill="none" stroke="#fffdf8" stroke-width="8"/>
    <!-- response packet, heading back -->
    <rect x="246" y="362" width="118" height="44" rx="22" fill="#e0722f" stroke-width="10"/>
    <polyline points="312,374 298,384 312,394" fill="none" stroke="#fffdf8" stroke-width="8"/>

    <!-- little "pop" marks where the hood opened -->
    <line x1="432" y1="176" x2="456" y2="160" stroke-width="9"/>
    <line x1="440" y1="214" x2="468" y2="214" stroke-width="9"/>
    <line x1="432" y1="252" x2="456" y2="268" stroke-width="9"/>
  </g>
</svg>
