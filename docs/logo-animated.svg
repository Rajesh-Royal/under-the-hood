<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">under the hood</title>
  <style>
    /* one-time intro: the hood springs open, then the rod and the marks bounce in */
    .lid { transform-origin: 104px 262px; transform: rotate(-22deg); animation: open 1.4s ease-in-out both; }
    .rod { transform-origin: 378px 276px; animation: spring .6s ease-in-out 1.2s both; }
    .pop line { transform-origin: 420px 214px; animation: spring .6s ease-in-out 1.35s both; }
    .pop line:nth-child(2) { animation-delay: 1.42s; }
    .pop line:nth-child(3) { animation-delay: 1.49s; }
    /* loop: packets slide across */
    .req { animation: req 3.2s cubic-bezier(.45,0,.35,1) 1.7s infinite both; }
    .res { animation: res 3.2s cubic-bezier(.45,0,.35,1) 3.3s infinite both; }
    .lane { animation: flow 1.6s linear infinite; }

    @keyframes open {
      0%, 25% { transform: rotate(0deg); }
      45%  { transform: rotate(-36deg); }
      60%  { transform: rotate(-14deg); }
      72%  { transform: rotate(-27deg); }
      83%  { transform: rotate(-19deg); }
      92%  { transform: rotate(-23deg); }
      100% { transform: rotate(-22deg); }
    }
    @keyframes spring {
      0%   { opacity: 0; transform: scale(0); }
      45%  { opacity: 1; transform: scale(1.25); }
      65%  { transform: scale(.9); }
      82%  { transform: scale(1.06); }
      100% { opacity: 1; transform: scale(1); }
    }
    /* packets travel across the box and slide out of view at the edges */
    @keyframes req {
      0%   { transform: translateX(-190px); }
      45%  { transform: translateX(0); }
      55%  { transform: translateX(0); }
      100% { transform: translateX(280px); }
    }
    @keyframes res {
      0%   { transform: translateX(190px); }
      45%  { transform: translateX(0); }
      55%  { transform: translateX(0); }
      100% { transform: translateX(-280px); }
    }
    @keyframes flow { to { stroke-dashoffset: -20; } }

    @media (prefers-reduced-motion: reduce) {
      .lid, .rod, .pop line, .req, .res, .lane { animation: none; }
    }
  </style>
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="2.6" fill="#d6cdbd"/>
    </pattern>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <!-- inside of the machine body, so packets slide in and out under its edges -->
    <clipPath id="inside"><rect x="99" y="279" width="314" height="146" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#f5f0e6"/>
    <rect width="512" height="512" fill="url(#dots)" opacity=".75"/>
  </g>

  <g stroke="#1f1d1a" stroke-linecap="round" stroke-linejoin="round">
    <!-- prop rod -->
    <line class="rod" x1="352" y1="152" x2="378" y2="276" stroke-width="10"/>

    <!-- hood -->
    <g class="lid">
      <rect x="92" y="226" width="336" height="40" rx="20" fill="#fffdf8" stroke-width="14"/>
      <line x1="140" y1="246" x2="300" y2="246" stroke="#d6cdbd" stroke-width="8"/>
    </g>

    <!-- body -->
    <rect x="92" y="272" width="328" height="160" rx="26" fill="#fffdf8" stroke-width="14"/>

    <g clip-path="url(#inside)">
      <line class="lane" x1="112" y1="326" x2="400" y2="326" stroke="#d6cdbd" stroke-width="7" stroke-dasharray="4 16"/>
      <line class="lane" x1="112" y1="384" x2="400" y2="384" stroke="#d6cdbd" stroke-width="7" stroke-dasharray="4 16" style="animation-direction: reverse"/>
      <g class="req">
        <rect x="150" y="304" width="118" height="44" rx="22" fill="#2f6fde" stroke-width="10"/>
        <polyline points="200,316 214,326 200,336" fill="none" stroke="#fffdf8" stroke-width="8"/>
      </g>
      <g class="res">
        <rect x="246" y="362" width="118" height="44" rx="22" fill="#e0722f" stroke-width="10"/>
        <polyline points="312,374 298,384 312,394" fill="none" stroke="#fffdf8" stroke-width="8"/>
      </g>
    </g>
    <!-- redraw the body outline on top so packets tuck under it cleanly -->
    <rect x="92" y="272" width="328" height="160" rx="26" fill="none" stroke-width="14"/>

    <!-- pop marks -->
    <g class="pop">
      <line x1="432" y1="176" x2="456" y2="160" stroke-width="9"/>
      <line x1="440" y1="214" x2="468" y2="214" stroke-width="9"/>
      <line x1="432" y1="252" x2="456" y2="268" stroke-width="9"/>
    </g>
  </g>
</svg>
